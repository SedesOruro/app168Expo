server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La PWA es una SPA: cualquier ruta desconocida devuelve index.html.
    # Sin esto, recargar en /historial da un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker y el manifest nunca se cachean: si el navegador se queda
    # con una version vieja, la persona no recibe las actualizaciones de la PWA.
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear sin limite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
}
